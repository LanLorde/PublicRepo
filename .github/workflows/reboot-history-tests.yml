name: Reboot history tests
on:
  push:
    paths:
      - Get-RebootHistory.ps1
      - tests/Get-RebootHistory.Tests.ps1
      - .github/workflows/reboot-history-tests.yml
  pull_request:
    paths:
      - Get-RebootHistory.ps1
      - tests/Get-RebootHistory.Tests.ps1
      - .github/workflows/reboot-history-tests.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test reboot history
        shell: ${{ matrix.shell }}
        run: ./tests/Get-RebootHistory.Tests.ps1
